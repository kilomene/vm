name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vm-agent to /opt/vm-agent
        run: |
          sudo mkdir -p /opt/vm-agent
          sudo chown "$USER:$USER" /opt/vm-agent
          # note: files pushed via the GitHub contents API lose the +x bit,
          # so invoke via bash explicitly
          VM_AGENT_HOME=/opt/vm-agent bash ./install.sh

      - name: Install test deps
        run: python3 -m pip install pytest

      - name: Run test suite
        run: |
          export VM_AGENT_HOME=/opt/vm-agent
          export PATH="/opt/vm-agent/bin:$PATH"
          python3 -m pytest tests/ -q

      - name: Health check
        if: always()
        run: /opt/vm-agent/bin/vm-agent health || true

      - name: Supervisor log on failure
        if: failure()
        run: tail -50 /opt/vm-agent/logs/supervisor.out || true
